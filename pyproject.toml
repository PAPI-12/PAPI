[project]
name = "papi-raborife-portfolio-backend"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
description = "Python API and operational stack for the Papi Raborife portfolio"

[tool.pytest.ini_options]
testpaths = ["backend"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]