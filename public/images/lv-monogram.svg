<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b89968"/>
      <stop offset="50%" stop-color="#e8d4a8"/>
      <stop offset="100%" stop-color="#8a6f48"/>
    </linearGradient>
  </defs>
  <g fill="url(#goldGrad)" stroke="url(#goldGrad)" stroke-width="0.5">
    <!-- L -->
    <path d="M10,15 L20,15 L20,75 L45,75 L45,85 L10,85 Z"/>
    <!-- V (overlapping) -->
